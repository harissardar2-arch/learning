<!DOCTYPE html>
<html>
<head>
<title>Pakistan Amazon.com</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<header>
<h1>amazon</h1>
<h1>deliver to pakistan</h1>
<div class="Search">
<div class="Search-inside">    
<input type="text" placeholder="Search Products">
<button class="search-icon">
<img class="icon" src="icon/search.svg">
</button>
</div>
</div>    
</header>

<div class="main">
<div class="sidebar">
<img  class="side-menu" src="images/SideMenu-icon.png">
<h3 class="Categories">Categories:</h3>
<ul>
<li>Fashion</li>
<li>Electronics</li>
<li>Footwear</li>
</ul>
</div>
<div class="Content">

<div class="card">
<img class="sidebar-image" src="images/Perfume.jpeg">

</div>
<div class="card">

</div>
<div class="card">
<img class="sidebar-image" src="images/Shoes.jpeg">

<p class="paragraph">$120</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img class="sidebar-image" src="images/Special perfume.jpeg">
<h4>Special perfume:</h4>
<p class="paragraph">$100</p>
<button>Add to Cart</button>
</div>
<div class="card">
<img class="sidebar-image" src="images/Mouse.jpeg">
<h4>Mouse:</h4>
<p class="paragraph">$30</p>
<button>Add to Cart</button>
</div>
<div class="card">
<img class="sidebar-image" src="images/Special shoes.jpeg">
<h4>Special shoe:</h4>
<p class="paragraph">$190</p>
<button>Add to Cart</button>
</div>

</div>
</div>

<footer>
<p>© 2026 Amazon | Online Store </p>
</footer>
    
</body>
</html>

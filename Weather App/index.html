<!DOCTYPE html>
<html>

<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <div class="weather-update">
            <h2>Weather Explorer</h2>
            <p>Stay updated with the latest weather conditions</p>
        </div>

        <div class="search-box">
            <input type="text" class="search-input">
            <button class="search-btn">Search</button>
        </div>
    
        <div class="weather-temperature">
            <img class="current-icon">
            <div class="temperature">
                <p class="city-name"style="color: orange; font-size: 30px; font-family: sans-serif; font-weight: bold;"></p>
                <p class="current-temp" style="font-family: sans-serif; font-size: 20px;"></p>
                <p class="current-desc" style="font-family: sans-serif; font-size: 20px;"></p>
            </div>
        </div>
        <div class="updates">
            <div class="day">
                <h2>Monday</h2>
                <img class="current-icon">
                <p></p>
            </div>
            <div class="day">
                <h2>Tuesday</h2>
                <img class="current-icon">
                <p></p>
            </div>
            <div class="day">
                <h2>Wednesday</h2>
                <img class="current-icon">
                <p></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
